# Meridian Retail — production host HTTP routing contract
#
# Stage 7 owns host-level HTTP ingress.
#
# Qualified Stage-6 upstreams:
#
#   auth     -> 127.0.0.1:8001
#   catalog  -> 127.0.0.1:8002
#   orders   -> 127.0.0.1:8003
#   frontend -> 127.0.0.1:8080
#
# PostgreSQL remains host-unpublished.
#
# TLS is intentionally outside this contract until authoritative
# production DNS and certificate ownership are qualified.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    access_log /var/log/nginx/meridian-access.log;
    error_log  /var/log/nginx/meridian-error.log;

    client_max_body_size 1m;


    # ------------------------------------------------------------
    # Public health aliases.
    #
    # Backend services expose /healthz natively. These exact
    # locations provide the public service-prefixed health contract.
    # ------------------------------------------------------------

    location = /api/auth/healthz {
        proxy_pass http://127.0.0.1:8001/healthz;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location = /api/catalog/healthz {
        proxy_pass http://127.0.0.1:8002/healthz;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location = /api/orders/healthz {
        proxy_pass http://127.0.0.1:8003/healthz;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ------------------------------------------------------------
    # Authentication API.
    #
    # No URI suffix on proxy_pass. Incoming /api/auth/... is
    # preserved exactly.
    # ------------------------------------------------------------

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }


    # ------------------------------------------------------------
    # Catalog API.
    # ------------------------------------------------------------

    location ^~ /api/catalog/ {
        proxy_pass http://127.0.0.1:8002;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }


    # ------------------------------------------------------------
    # Orders API.
    #
    # Matches both /api/orders and /api/orders/...
    # ------------------------------------------------------------

    location ^~ /api/orders {
        proxy_pass http://127.0.0.1:8003;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }


    # ------------------------------------------------------------
    # Frontend fallback.
    #
    # API locations above take precedence.
    # ------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
