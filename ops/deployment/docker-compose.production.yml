name: meridian-retail

x-db-common: &db-common
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:?DB_NAME is required}

services:

  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    platform: linux/amd64
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_ADMIN_USER:?DB_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - meridian-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s


  auth-service:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/meridian/auth:${IMAGE_TAG:?IMAGE_TAG is required}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped

    environment:
      <<: *db-common
      DB_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}

    ports:
      - "127.0.0.1:8001:8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - meridian-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  catalog-service:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/meridian/catalog:${IMAGE_TAG:?IMAGE_TAG is required}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped

    environment:
      <<: *db-common
      DB_USER: ${CATALOG_DB_USER:?CATALOG_DB_USER is required}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD is required}
      PORT: "4000"

    ports:
      - "127.0.0.1:8002:4000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - meridian-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:4000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  orders-service:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/meridian/orders:${IMAGE_TAG:?IMAGE_TAG is required}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped

    environment:
      <<: *db-common
      DB_USER: ${ORDERS_DB_USER:?ORDERS_DB_USER is required}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD is required}
      AUTH_SERVICE_URL: http://auth-service:8000
      CATALOG_SERVICE_URL: http://catalog-service:4000

    ports:
      - "127.0.0.1:8003:8001"

    depends_on:
      postgres:
        condition: service_healthy

      auth-service:
        condition: service_healthy

      catalog-service:
        condition: service_healthy

    networks:
      - meridian-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  frontend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/meridian/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    networks:
      - meridian-net

    healthcheck:
      test:
        [
          "CMD",
          "/busybox",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s


volumes:
  postgres_data:
    name: meridian-postgres-data


networks:
  meridian-net:
    name: meridian-net
    driver: bridge